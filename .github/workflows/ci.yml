name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: lint
        run: ruff check src tests
      - name: tests
        run: pytest -q --cov=stayline --cov-report=term-missing

  train:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: keep the committed numbers for comparison
        run: cp outputs/metrics.json /tmp/committed_metrics.json
      - name: run the full pipeline
        run: stayline
      - name: compare with committed metrics
        run: python -m stayline.verify /tmp/committed_metrics.json outputs/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: stayline-run
          path: |
            outputs/metrics.json
            outputs/bundle.joblib
            outputs/tables/
            assets/
